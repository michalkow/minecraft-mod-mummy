// Three Fabric mods built from one repository: mummy/, verity/ and zombie-kingdom/.
// Each sub-project sets its mod_id, mod_version and archives_base_name in its own gradle.properties;
// everything else is shared and configured here.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = project.mod_version
	group = project.maven_group

	base {
		archivesName = project.archives_base_name
	}

	loom {
		splitEnvironmentSourceSets()

		mods {
			register(project.mod_id) {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "${project.mod_id}-gametest"
			// Server game tests need the Minecraft EULA accepted in the test run directory,
			// so only the client game test (singleplayer) is enabled.
			enableGameTests = false
			enableClientGameTests = true
		}
	}

	// Runs the client game tests against the built mod jar in a production-like game (as a launcher would run it),
	// alongside Fabric API, the game test API and the tests themselves.
	configurations {
		productionTestMods
	}

	tasks.register("gametestJar", Jar) {
		from sourceSets.gametest.output
		archiveClassifier = "gametest"
	}

	tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
		// All sub-projects share Loom's asset cache; make Gradle aware of every writer.
		dependsOn(rootProject.subprojects.collect { it.tasks.named("downloadAssets") })
		jvmArgs.add("-Dfabric.client.gametest")
		mods.from(configurations.productionTestMods)
		mods.from(tasks.named("gametestJar"))
	}

	// The same, with the other two mods installed as well: checks the three get along in one game.
	tasks.register("runProductionClientGameTestWithAllMods", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
		dependsOn(rootProject.subprojects.collect { it.tasks.named("downloadAssets") })
		jvmArgs.add("-Dfabric.client.gametest")
		mods.from(configurations.productionTestMods)
		mods.from(tasks.named("gametestJar"))
		rootProject.subprojects.findAll { it != project }.each { sibling ->
			mods.from(sibling.tasks.named("jar"))
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		productionTestMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		productionTestMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
		productionTestMods fabricApi.module("fabric-gametest-api-v1", project.fabric_api_version)
	}

	processResources {
		def version = project.version
		inputs.property "version", version

		filesMatching("fabric.mod.json") {
			expand "version": version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		def projectName = project.name
		inputs.property "projectName", projectName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_$projectName" }
		}
	}
}
